[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wazobiamail"
version = "0.1.0"
description = "Official WazobiaMail Python SDK for transactional email via API. Start free with 3,000 emails/month. A Resend alternative that also supports SMTP, with domains, hosted mailboxes, and deliverability tools."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Bowofade Oyerinde", email = "bowofade@bonifade.com" },
]
keywords = [
  "wazobiamail",
  "email",
  "transactional-email",
  "smtp",
  "mailboxes",
  "deliverability",
  "resend-alternative",
  "email-api",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
]
dependencies = []

[project.urls]
Homepage = "https://wazobiamail.com"
Documentation = "https://docs.wazobiamail.com"
Repository = "https://github.com/WazobiaMail/wazobiamail-python"
Issues = "https://github.com/WazobiaMail/wazobiamail-python/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["wazobiamail*"]

[tool.setuptools.package-data]
wazobiamail = ["py.typed"]

[tool.setuptools.exclude-package-data]
wazobiamail = ["__pycache__/*", "**/__pycache__/*", "*.pyc", "**/*.pyc"]
